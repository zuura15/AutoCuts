[project]
name = "autocuts"
version = "0.4.1"
description = "Local CLI that exports one span per lasting look, from its first appearance to its last, leaving inner junk in place."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zuura15" }]
dependencies = [
  "scenedetect>=0.6.4",
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
dino = ["torch>=2.2"]

[project.scripts]
autocuts = "autocuts.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
