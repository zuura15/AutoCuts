[project]
name = "autocuts"
version = "0.1.0"
description = "Local CLI: split compilation videos into scenes, drop short pan-outs, keep the main action."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zuura15" }]
dependencies = [
  "scenedetect>=0.6.4",
  "opencv-python-headless>=4.8",
]

[project.scripts]
autocuts = "autocuts.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
